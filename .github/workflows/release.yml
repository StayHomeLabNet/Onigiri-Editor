name: Release Onigiri Editor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            label: macos-universal
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri application
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: npx tauri build --target ${{ matrix.target }}

      - name: Collect release binaries
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p release-assets
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cp "$BUNDLE_DIR"/dmg/*.dmg release-assets/
            (cd "$BUNDLE_DIR/macos" && tar -czf "$GITHUB_WORKSPACE/release-assets/Onigiri_Editor_${TAG}_macos-universal.app.tar.gz" "Onigiri Editor.app")
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp "$BUNDLE_DIR"/nsis/*.exe release-assets/
            cp "$BUNDLE_DIR"/msi/*.msi release-assets/
          elif [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            cp "$BUNDLE_DIR"/appimage/*.AppImage release-assets/
            cp "$BUNDLE_DIR"/deb/*.deb release-assets/
          fi
          ls -lh release-assets/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.label }}
          path: release-assets/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: all-binaries
          merge-multiple: true

      - name: Publish GitHub Release with English & Japanese Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ls -lh all-binaries/

          cat << EOF > release-notes.md
          ## English

          ### Onigiri Editor \`$TAG\`

          **Onigiri Editor** is a cross-platform Markdown, code & dev-preview desktop editor built for the AI era on **macOS, Windows, and Linux**—with **Simple / Basic / Advanced** UI modes, bidirectional active line/block indicators, 100+ language syntax highlighting with custom colors, OS-aware first-launch language detection, session restore & auto-save, external file change conflict detection, AI pre-apply diff preview, AI CLI connection support, project dev-server diagnostics, and dual browser preview options.

          #### Highlights
          - **OS-Aware First-Launch Language**: Automatically starts in Japanese on Japanese OS locales and English on all other OS locales (with native localized menu bar).
          - **Session Restore, Draft Recovery & Auto-Save**: Restores open tabs, unsaved drafts, cursor positions, and workspace folders across launches, plus optional 1.5s auto-save.
          - **External File Change Detection**: Auto-reloads clean tabs changed on disk and shows a conflict banner (\`Reload\`, \`Compare Diff\`, \`Keep Mine\`, \`Save Again\`, \`Keep as Draft\`) for edited or deleted files.
          - **AI Pre-Apply Diff Preview**: Inspect line-by-line diffs before replacing document text (with automatic snapshot option) or writing workspace files.
          - **AI Chat, Dev Server Diagnostics & Dual Browser Preview**: Supports Codex / Claude Code / Gemini / Antigravity CLIs, Cloud APIs, Ollama, LM Studio, built-in multi-WebView browser, and external HTTP live preview.

          #### Downloads
          - **macOS (Universal: Apple Silicon & Intel)**: \`.dmg\` / \`.app.tar.gz\`
          - **Windows (x64)**: \`.exe\` (NSIS installer) / \`.msi\`
          - **Linux (x64)**: \`.AppImage\` / \`.deb\`

          ---

          ## 日本語

          ### Onigiri Editor \`$TAG\`

          **Onigiri Editor** は、**macOS・Windows・Linux** に対応した AI 時代向けの Markdown・コード・Web 開発プレビュー統合デスクトップエディタです。**シンプル / 標準 / 拡張** の 3 モード切替、双方向編集中行ハイライト、100言語以上のシンタックスハイライト＋色カスタマイズ、初回起動時の OS 言語自動判定、セッション復元・自動保存、外部ファイル変更検知、AI 適用前 Diff プレビュー、AI CLI 接続サポート、開発サーバー診断、内蔵 Web ブラウザ＆外部ライブプレビューを備えています。

          #### 主なポイント
          - **初回起動時の OS 言語自動判定**: 日本語 OS では日本語 UI・日本語メニューバーで起動し、その他の言語環境では英語 UI・英語メニューで起動します。
          - **セッション復元・未保存ドラフト保護・自動保存**: 開いていたタブ・下書き・カーソル位置・ワークスペースを次回起動時に復元し、1.5秒デバウンスの自動保存にも対応します。
          - **外部ファイル変更検知**: 外部ツールや AI CLI による変更・削除を検知し、未編集タブは自動反映、未保存編集がある場合は **再読み込み / 差分比較 / 編集維持** 等の解決バナーを表示します。
          - **AI 適用前 Diff プレビューモーダル**: 「本文を置換」（スナップショット自動保存オプション付き）や「フォルダーへ書き込み」の実行前に、行単位の差分を確認できます。
          - **AI チャット・開発サーバー診断・2パターンのブラウザ連携**: Codex / Claude Code / Gemini / Antigravity CLI・各種 Cloud API・Ollama・LM Studio・内蔵マルチ WebView ブラウザ・外部ライブプレビューに対応しています。

          #### ダウンロード（バイナリ一覧）
          - **macOS（Universal: Apple Silicon / Intel 両対応）**: \`.dmg\` / \`.app.tar.gz\`
          - **Windows（x64）**: \`.exe\`（インストーラ） / \`.msi\`
          - **Linux（x64）**: \`.AppImage\` / \`.deb\`
          EOF
          sed -i 's/^          //' release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Onigiri Editor $TAG" --notes-file release-notes.md
            gh release upload "$TAG" all-binaries/* --clobber
          else
            gh release create "$TAG" all-binaries/* --title "Onigiri Editor $TAG" --notes-file release-notes.md
          fi
