name: Build Windows Preview

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri application (Windows x64)
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Collect Windows binaries
        shell: bash
        run: |
          mkdir -p release-assets
          BUNDLE_DIR="src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          cp "$BUNDLE_DIR"/nsis/*.exe release-assets/
          cp "$BUNDLE_DIR"/msi/*.msi release-assets/
          ls -lh release-assets/

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-preview
          path: release-assets/*
          retention-days: 7
