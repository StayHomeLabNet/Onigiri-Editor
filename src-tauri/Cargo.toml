[package]
name = "onigiri-editor"
version = "1.5.4"
description = "Onigiri Editor - AI-Era Cross-Platform Markdown & Code Editor"
authors = ["StayHomeLabNet"]
license = "MIT"
repository = "https://github.com/StayHomeLabNet/Onigiri-Editor"
edition = "2021"

[lib]
name = "onigiri_editor_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "time", "io-util", "net", "sync", "macros", "rt"] }
base64 = "0.22"
url = "2"
encoding_rs = "0.8"
chardetng = "0.1"
regex = "1"
if-addrs = "0.15"
sha2 = "0.10"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSString"] }

